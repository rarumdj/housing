services:
  mysql:
    image: mysql:8.0
    container_name: househunt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DATABASE:-house_hunt}
    ports:
      # 3307 on the host avoids conflicting with XAMPP MySQL on 3306
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: househunt-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  adminer:
    image: adminer:4
    container_name: househunt-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: househunt-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: development
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      DATABASE: ${DATABASE:-house_hunt}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_DIALECT: mysql
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/config:/app/backend/config
      - ./backend/migrations:/app/backend/migrations
      - ./backend/uploads:/app/backend/uploads
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: househunt-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    environment:
      VITE_PROXY_TARGET: http://api:4000
      VITE_PORT: "5173"
    volumes:
      - ./package-lock.json:/app/package-lock.json
      - ./frontend/package.json:/app/frontend/package.json
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
    command: ["npm", "run", "dev"]

volumes:
  mysql_data:
